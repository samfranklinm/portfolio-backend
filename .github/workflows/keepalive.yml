name: Keep App Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping app with retry
        run: |
          for i in {1..3}; do
            if curl -f --max-time 30 https://portfolio-backend-c9ru.onrender.com/api/health; then
              echo "Ping successful on attempt $i"
              exit 0
            else
              echo "Ping failed on attempt $i"
              sleep 10
            fi
          done
          echo "All ping attempts failed"
          exit 1